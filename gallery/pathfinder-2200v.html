<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #162852; --navy-mid: #1E3668; --navy-faint: #0F1F40;
      --aqua: #5BB8CC; --aqua-dark: #3A9AB0;
      --cream: #F4F0E6;
      --white: #FFFFFF; --text: #1C2B4A; --text-mid: #4A5875;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }
    body { font-family: var(--font-body); background: var(--cream); color: var(--text); min-height: 100vh; }

    .g-nav {
      background: var(--navy-faint); padding: 1.1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .g-back {
      display: flex; align-items: center; gap: 0.45rem;
      color: rgba(255,255,255,0.65); text-decoration: none;
      font-size: 0.78rem; font-weight: 500; letter-spacing: 0.03em;
      transition: color 0.2s;
    }
    .g-back:hover { color: var(--aqua); }
    .g-brand { font-family: var(--font-display); font-size: 0.95rem; font-weight: 300; letter-spacing: 0.1em; color: rgba(255,255,255,0.4); }

    .g-hero { background: var(--navy-faint); padding: 3rem 2rem 3.5rem; text-align: center; }
    .g-badge {
      display: inline-block;
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
      padding: 0.28rem 0.75rem; border-radius: 3px;
      background: rgba(91,184,204,0.15); border: 1px solid rgba(91,184,204,0.3); color: var(--aqua);
      margin-bottom: 1rem;
    }
    .g-title {
      font-family: var(--font-display); font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 300; font-style: italic; color: var(--white); line-height: 1.1;
    }
    .g-meta { margin-top: 0.6rem; font-size: 0.78rem; color: rgba(255,255,255,0.38); letter-spacing: 0.06em; }

    .g-body { max-width: 1280px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }

    .g-group { margin-bottom: 3rem; }
    .g-group-label {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
      padding-bottom: 0.8rem; margin-bottom: 1.25rem;
      border-bottom: 1px solid rgba(22,40,82,0.14);
    }
    .g-group-label.before { color: #8B6A3A; }
    .g-group-label.after  { color: var(--aqua-dark); }

    .g-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem;
    }
    .g-item { position: relative; border-radius: 7px; overflow: hidden; background: var(--navy-faint); }
    .g-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .g-label {
      position: absolute; top: 0.6rem; left: 0.6rem;
      font-family: var(--font-body); font-size: 0.54rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; padding: 0.2rem 0.52rem; border-radius: 3px;
    }
    .g-label.before { background: rgba(0,0,0,0.68); color: rgba(255,255,255,0.88); }
    .g-label.after  { background: rgba(91,184,204,0.92); color: var(--navy-faint); }

    .g-foot {
      background: var(--navy-faint); text-align: center; padding: 2.5rem 1.5rem;
    }
    .g-book {
      display: inline-block; font-family: var(--font-body); font-size: 0.88rem; font-weight: 600;
      color: var(--white); text-decoration: none;
      padding: 0.85rem 2.5rem; border-radius: 6px;
      background: var(--aqua-dark);
      transition: background 0.2s, transform 0.2s;
    }
    .g-book:hover { background: var(--aqua); transform: translateY(-1px); }

    @media (max-width: 900px) { .g-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 540px) {
      .g-nav { padding: 1rem 1.25rem; }
      .g-hero { padding: 2rem 1.25rem 2.5rem; }
      .g-body { padding: 2rem 1rem 3rem; }
      .g-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
